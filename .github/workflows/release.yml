name: Package Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  desktop-release-gate:
    name: Build, package and publish after successful CI
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Resolve package version
        id: version
        shell: pwsh
        env:
          CI_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          $tags = @(& git tag --list)
          if ($LASTEXITCODE -ne 0) { throw 'Failed to read Git tags.' }
          $latestTag = $tags |
            Where-Object { $_ -cmatch '^v?[0-9]+\.[0-9]+\.[0-9]+$' } |
            Sort-Object { [version]($_ -replace '^v', '') } -Descending |
            Select-Object -First 1
          if (-not $latestTag) {
            throw 'No version tag found. Create and push a tag such as 0.8.0.'
          }
          $baseVersion = $latestTag -replace '^v', ''
          $buildNumber = 0
          if (-not [int]::TryParse($env:CI_RUN_NUMBER, [ref]$buildNumber) -or $buildNumber -le 0) {
            throw 'CI run number must be a positive 32-bit integer.'
          }
          $v = "$baseVersion.$buildNumber"
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build and package after CI
        shell: pwsh
        run: ./scripts/pack-windows.ps1 -Configuration Release -Version '${{ steps.version.outputs.version }}'
      - name: Upload package build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: package-build-${{ steps.version.outputs.version }}
          path: |
            artifacts/release/
            artifacts/benchmarks/
            artifacts/ci-diagnostics/
            artifacts/render-goldens/
            artifacts/logs/
            build-core/ctest-results.xml
          if-no-files-found: ignore
      - name: Upload release NuGet packages (only after full gate)
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: MonacoNative-${{ steps.version.outputs.version }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/winrt/x64/Release/*.winmd
          if-no-files-found: error
      - name: NuGet login with GitHub OIDC
        if: success()
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USERNAME }}
      - name: Publish NuGet packages
        if: success()
        shell: pwsh
        run: |
          Get-ChildItem artifacts/packages/*.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --api-key '${{ steps.nuget-login.outputs.NUGET_API_KEY }}' --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
