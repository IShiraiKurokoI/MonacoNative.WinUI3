name: Package Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: NuGet base version with an approved Windows acceptance record
        required: true
        default: 0.8.0
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  desktop-release-gate:
    name: Mandatory Windows tests and approved manual evidence
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $baseVersion = '${{ inputs.version }}'
          } else {
            $baseVersion = '${{ github.event.workflow_run.head_branch }}'.TrimStart('v')
          }
          if ($baseVersion -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid NuGet base version: $baseVersion"
          }
          $commitUnixTime = [int64](& git show -s --format=%ct HEAD)
          $timestamp = [DateTimeOffset]::FromUnixTimeSeconds($commitUnixTime).UtcDateTime.ToString('yyyyMMddHHmmss')
          $v = if ($baseVersion.Contains('-')) { "$baseVersion.$timestamp" } else { "$baseVersion-ci.$timestamp" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Install pinned Windows App Runtime for headless Win2D
        shell: pwsh
        run: ./scripts/install-windows-app-runtime-ci.ps1
      - name: Validate native, WinUI, render baseline, packaging and human acceptance
        shell: pwsh
        run: ./scripts/test-acceptance.ps1 -Mode Release -Configuration Release -PackageVersion '${{ steps.version.outputs.version }}'
      - name: Upload release gate and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-validation-${{ steps.version.outputs.version }}
          path: |
            artifacts/release/
            artifacts/benchmarks/
            artifacts/ci-diagnostics/
            artifacts/render-goldens/
            artifacts/logs/
            build-core/ctest-results.xml
          if-no-files-found: ignore
      - name: Upload release NuGet packages (only after full gate)
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: MonacoNative-${{ steps.version.outputs.version }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/winrt/x64/Release/*.winmd
          if-no-files-found: error
      - name: NuGet login with GitHub OIDC
        if: success()
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USERNAME }}
      - name: Publish NuGet packages
        if: success()
        shell: pwsh
        run: |
          Get-ChildItem artifacts/packages/*.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --api-key '${{ steps.nuget-login.outputs.NUGET_API_KEY }}' --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
