name: Package Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: NuGet version with an approved Windows acceptance record
        required: true
        default: 0.1.0
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  desktop-release-gate:
    name: Mandatory Windows tests and approved manual evidence
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v = '${{ inputs.version }}'
          } else {
            $v = '${{ github.ref_name }}'.TrimStart('v')
          }
          if ($v -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid NuGet version: $v"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Install pinned Windows App Runtime for headless Win2D
        shell: pwsh
        run: ./scripts/install-windows-app-runtime-ci.ps1
      - name: Validate native, WinUI, render baseline, packaging and human acceptance
        shell: pwsh
        run: ./scripts/test-acceptance.ps1 -Mode Release -Configuration Release -PackageVersion '${{ steps.version.outputs.version }}'
      - name: Upload release gate and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-validation-${{ steps.version.outputs.version }}
          path: |
            artifacts/release/
            artifacts/benchmarks/
            artifacts/ci-diagnostics/
            artifacts/render-goldens/
            artifacts/logs/
            build-core/ctest-results.xml
          if-no-files-found: ignore
      - name: Upload release NuGet packages (only after full gate)
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: MonacoNative-${{ steps.version.outputs.version }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/winrt/x64/Release/*.winmd
          if-no-files-found: error
