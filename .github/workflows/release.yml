name: Package Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  desktop-release-gate:
    name: Build, package and publish after successful CI
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          $baseVersion = '${{ github.event.workflow_run.head_branch }}'.TrimStart('v')
          if ($baseVersion -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid NuGet base version: $baseVersion"
          }
          $commitUnixTime = [int64](& git show -s --format=%ct HEAD)
          $timestamp = [DateTimeOffset]::FromUnixTimeSeconds($commitUnixTime).UtcDateTime.ToString('yyyyMMddHHmmss')
          $v = if ($baseVersion.Contains('-')) { "$baseVersion.$timestamp" } else { "$baseVersion-ci.$timestamp" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build and package after CI
        shell: pwsh
        run: ./scripts/pack-windows.ps1 -Configuration Release -Version '${{ steps.version.outputs.version }}'
      - name: Upload package build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: package-build-${{ steps.version.outputs.version }}
          path: |
            artifacts/release/
            artifacts/benchmarks/
            artifacts/ci-diagnostics/
            artifacts/render-goldens/
            artifacts/logs/
            build-core/ctest-results.xml
          if-no-files-found: ignore
      - name: Upload release NuGet packages (only after full gate)
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: MonacoNative-${{ steps.version.outputs.version }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/winrt/x64/Release/*.winmd
          if-no-files-found: error
      - name: NuGet login with GitHub OIDC
        if: success()
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USERNAME }}
      - name: Publish NuGet packages
        if: success()
        shell: pwsh
        run: |
          Get-ChildItem artifacts/packages/*.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --api-key '${{ steps.nuget-login.outputs.NUGET_API_KEY }}' --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
