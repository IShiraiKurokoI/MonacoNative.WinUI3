name: CI

on:
  push:
  pull_request:

jobs:
  linux-gcc:
    name: Native core, managed integration and parity (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Unified portable source and tooling validation
        run: python3 scripts/check-source.py
      - name: Configure native GCC Release build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMONACONATIVE_WARNINGS_AS_ERRORS=ON
      - name: Build native core and ABI tests
        run: cmake --build build --parallel
      - name: Test native text model, cursor, folding and Unicode
        run: ctest --test-dir build --output-on-failure -L '^core$' --output-junit "$PWD/build/ctest-core.xml"
      - name: Test native C ABI and lifetime contracts
        run: ctest --test-dir build --output-on-failure -L '^abi$' --output-junit "$PWD/build/ctest-abi.xml"
      - name: Test native input backends
        run: ctest --test-dir build --output-on-failure -L '^input$' --output-junit "$PWD/build/ctest-input.xml"
      - name: Test native TypeScript scanner and declaration fixtures
        run: python3 scripts/test-native-languages.py --native-library "$PWD/build/src/MonacoNative.Core.Native/libMonacoNative.Core.Native.so"
      - name: Test text composition and internationalization
        run: dotnet run --project tests/InputTests/MonacoNative.Input.Tests.csproj -c Release
      - name: Test accessibility and pseudolocalization
        run: dotnet run --project tests/AccessibilityTests/MonacoNative.Accessibility.Tests.csproj -c Release
      - name: Test language providers and contributions
        run: MONACONATIVE_NATIVE_LIBRARY="$PWD/build/src/MonacoNative.Core.Native/libMonacoNative.Core.Native.so" dotnet run --project tests/LanguageTests/MonacoNative.Language.Tests.csproj -c Release -- --require-native
      - name: Test LSP protocol and provider integration
        run: dotnet run --project tests/LspTests/MonacoNative.Lsp.Tests.csproj -c Release
      - name: Test renderer cache and incremental invalidation
        run: dotnet run --project tests/RendererLogicTests/MonacoNative.RendererLogic.Tests.csproj -c Release
      - name: Measure native core quick performance budgets
        run: bash ./scripts/run-benchmarks.sh quick
      - name: Measure native core full performance budgets
        run: bash ./scripts/run-benchmarks.sh full
      - name: Validate Monaco compatibility and release evidence
        run: python3 scripts/check-parity-release.py --allow-missing-windows --output artifacts/release/parity-report.json
      - name: Upload native core performance and parity report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-core-performance-and-parity
          path: |
            artifacts/benchmarks/core-quick.json
            artifacts/benchmarks/core-full.json
            artifacts/release/parity-report.json
          if-no-files-found: ignore
      - name: Upload GCC CTest result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-gcc-ctest-results
          path: build/ctest-*.xml
          if-no-files-found: ignore

  linux-clang-sanitizers:
    name: Native core and integration under ASan/UBSan (Clang)
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Validate Windows ABI UTF-16 compilation
        run: >-
          clang++ -std=c++20 -fshort-wchar -D_WIN32 -D__cdecl= '-D__declspec(x)='
          -Wall -Wextra -Wpedantic -fsyntax-only
          -Isrc/MonacoNative.Core.Native -Itests/TestSupport
          tests/NativeAbiTests/main.cpp
      - name: Configure ASan and UBSan build
        run: cmake -S . -B build-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMONACONATIVE_ENABLE_SANITIZERS=ON -DMONACONATIVE_WARNINGS_AS_ERRORS=ON
      - name: Build sanitized native core
        run: cmake --build build-sanitize --parallel
      - name: Test core model and Unicode under ASan/UBSan
        run: ctest --test-dir build-sanitize --output-on-failure -L '^core$' --output-junit "$PWD/build-sanitize/ctest-core.xml"
      - name: Test native ABI under ASan/UBSan
        run: ctest --test-dir build-sanitize --output-on-failure -L '^abi$' --output-junit "$PWD/build-sanitize/ctest-abi.xml"
      - name: Test input backend under ASan/UBSan
        run: ctest --test-dir build-sanitize --output-on-failure -L '^input$' --output-junit "$PWD/build-sanitize/ctest-input.xml"
      - name: Test input and internationalization
        run: dotnet run --project tests/InputTests/MonacoNative.Input.Tests.csproj -c Release
      - name: Test accessibility
        run: dotnet run --project tests/AccessibilityTests/MonacoNative.Accessibility.Tests.csproj -c Release
      - name: Test language providers
        run: dotnet run --project tests/LanguageTests/MonacoNative.Language.Tests.csproj -c Release
      - name: Test LSP protocol
        run: dotnet run --project tests/LspTests/MonacoNative.Lsp.Tests.csproj -c Release
      - name: Test renderer cache logic
        run: dotnet run --project tests/RendererLogicTests/MonacoNative.RendererLogic.Tests.csproj -c Release
      - name: Upload sanitized CTest result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-clang-sanitizer-test-results
          path: build-sanitize/ctest-*.xml
          if-no-files-found: ignore

  windows-desktop-tests:
    name: Windows desktop ${{ matrix.configuration }} acceptance and package consumers
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned Windows App Runtime for headless Win2D
        shell: pwsh
        run: ./scripts/install-windows-app-runtime-ci.ps1
      - name: Run unified Windows desktop automated acceptance
        shell: pwsh
        run: ./scripts/test-acceptance.ps1 -Mode Automated -Configuration ${{ matrix.configuration }} -RunPackages -PackageVersion 0.1.0-ci
      - name: Restore and execute a package-only x64 consumer with an empty cache
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: ./scripts/test-package-isolated.ps1 -Platform x64 -Configuration Release -Version 0.1.0-ci
      - name: Upload Windows acceptance results, CTest and package smoke logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-acceptance-test-evidence-${{ matrix.configuration }}
          path: |
            artifacts/release/acceptance-report.json
            artifacts/release/layer-report.json
            artifacts/tests/isolated-package.json
            artifacts/release/parity-report.json
            artifacts/logs/
            artifacts/tests/isolated-*-stdout.log
            artifacts/tests/isolated-*-stderr.log
            build-core/ctest-results.xml
          if-no-files-found: ignore
      - name: Upload headless renderer logs, PNG and fingerprints
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-renderer-headless-diagnostics-${{ matrix.configuration }}
          path: |
            artifacts/ci-diagnostics/
            artifacts/render-goldens/renderer-current-*.json
            artifacts/render-goldens/renderer-current-*.png
          if-no-files-found: ignore
      - name: Upload Windows performance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-acceptance-benchmarks-${{ matrix.configuration }}
          path: |
            artifacts/benchmarks/core-quick.json
            artifacts/benchmarks/core-full.json
            artifacts/benchmarks/renderer-quick.json
          if-no-files-found: ignore
      - name: Upload candidate NuGet packages
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-acceptance-candidate-packages-${{ matrix.configuration }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: ignore

  windows-arm64-native:
    name: Native ARM64 runtime, ABI and managed integration
    runs-on: windows-11-vs2026-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build and execute ARM64 CTest and managed native ABI
        shell: pwsh
        run: ./scripts/test-native-arm64.ps1 -Configuration Release
      - name: Upload ARM64 runtime evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-arm64-native-runtime
          path: |
            artifacts/tests/arm64-native.json
            build-arm64-native/ctest-arm64.xml
          if-no-files-found: ignore

  windows-arm64-package:
    name: Native ARM64 isolated NuGet runtime consumer
    needs: [windows-desktop-tests, windows-arm64-native]
    runs-on: windows-11-vs2026-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Download release-configuration candidate packages
        uses: actions/download-artifact@v7
        with:
          name: windows-acceptance-candidate-packages-Release
          path: artifacts/packages
      - name: Execute isolated ARM64 package consumer
        shell: pwsh
        run: ./scripts/test-package-isolated.ps1 -Platform ARM64 -Configuration Release -Version 0.1.0-ci
      - name: Upload isolated ARM64 package evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-arm64-isolated-package
          path: |
            artifacts/tests/isolated-package.json
            artifacts/tests/isolated-*-stdout.log
            artifacts/tests/isolated-*-stderr.log
          if-no-files-found: ignore
