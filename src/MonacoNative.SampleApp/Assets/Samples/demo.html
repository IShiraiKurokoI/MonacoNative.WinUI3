<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MonacoNative • HTML</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 3rem; }
        .card { padding: 1.5rem; border-radius: 12px; background: #eff6ff; }
    </style>
</head>
<body>
    <main class="card">
        <h1>Hello, MonacoNative!</h1>
        <p>Edit this <strong>HTML</strong> sample and try Find / Replace.</p>
        <button id="greet">Say hello</button>
    </main>
    <script>
        document.querySelector('#greet').addEventListener('click', () => {
            console.log('Hello from the HTML sample');
        });
    </script>
</body>
</html>
